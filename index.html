<!DOCTYPE html>
<html>
<head>
    <title>Meine erste Software</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
        }

        input {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #ausgabe {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Meine erste Software</h1>

        <p>Wie heißt du?</p>

        <input type="text" id="name" placeholder="Dein Name">

        <br>

        <button onclick="begrüssen()">Begrüßen</button>

        <h2 id="ausgabe"></h2>

    </div>

    <script>
        function begrüssen() {
            let name = document.getElementById("name").value;

            if (name === "") {
                document.getElementById("ausgabe").textContent =
                    "Bitte gib deinen Namen ein.";
                return;
            }

            document.getElementById("ausgabe").textContent =
                "Hallo " + name + "!";
        }
    </script>

</body>
</html>
